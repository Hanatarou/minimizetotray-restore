name: Build XPI

# Builds the XPI with the exact recipe documented in the README
# ("Building from source"), names it after the manifest version and attaches
# it — together with its SHA-256 checksum file — to the GitHub release.
#
#   minimizetotray-restore-v<version>.xpi
#   minimizetotray-restore-v<version>.xpi.sha256.txt
#
# Triggers:
#  - pushing a tag v*            -> builds and attaches to the release
#  - workflow_dispatch (manual)  -> build-only sanity run, no release upload
#
# Deliberately NO "release: published" trigger: creating a release with a new
# tag fires BOTH the tag-push and the release events, and both runs would
# build the XPI and race to upload the same two asset names. The zip embeds
# file timestamps, so the two builds differ byte by byte — the release would
# end up with the .xpi of one build and the checksum of the other, and the
# published hash would never match. One event, one build, one upload.
# The build is also deterministic (fixed mtimes, sorted file list), so
# rebuilding the same commit reproduces the exact same bytes and hash.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the version in manifest.json (v${{ steps.version.outputs.version }}). Bump manifest.json or fix the tag."
            exit 1
          fi

      - name: Build XPI and SHA-256 checksum
        run: |
          XPI="minimizetotray-restore-v${{ steps.version.outputs.version }}.xpi"
          # Same file set as the documented manual build (no README/CHANGELOG/LICENSE).
          # Fixed mtimes + sorted file list -> byte-identical XPI for the same
          # sources, so the checksum matches any rebuild of the same commit.
          find manifest.json background.js _locales api options icons \
            -exec touch -d '@946684800' {} +
          zip -X "$XPI" manifest.json background.js \
            $(find _locales api options icons -type f | sort)
          sha256sum "$XPI" > "$XPI.sha256.txt"
          echo "Built ${XPI}:"
          cat "$XPI.sha256.txt"

      - name: Upload build artifact (manual runs only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: |
            minimizetotray-restore-v*.xpi
            minimizetotray-restore-v*.xpi.sha256.txt

      - name: Attach XPI + checksum to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            minimizetotray-restore-v*.xpi
            minimizetotray-restore-v*.xpi.sha256.txt
